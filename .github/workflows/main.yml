name: Test Internet (Verbose)

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Force long log
        run: |
          echo "=== Start ==="
          for i in {1..20}; do
            echo "Line $i"
            sleep 0.1
          done

      - name: Check Google
        run: |
          set -x
          curl -I https://www.google.com || true

      - name: Check Telegram API
        run: |
          set -x
          curl -I https://api.telegram.org || true

      - name: Print IP
        run: |
          set -x
          curl ifconfig.me
